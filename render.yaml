services:
  - type: web
    name: leadia-piloto-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/whatsapp/Dockerfile
    dockerContext: ./deploy/whatsapp
    healthCheckPath: /healthz
    envVars:
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_EVOLUTION_ENABLED
        value: "false"
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AI_AUTH_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
