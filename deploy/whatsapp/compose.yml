services:
  webhook:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Provedor: meta (padrão, Cloud API oficial) ou evolution (ensaio com número de teste).
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      # Meta: a validação de cada variável acontece na inicialização do webhook.
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEST_RECIPIENTS: ${WHATSAPP_TEST_RECIPIENTS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      # Evolution (ensaio): segredos só no Environment do serviço.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      EVOLUTION_CHANNEL_KEY: ${EVOLUTION_CHANNEL_KEY:-}
      WHATSAPP_CRM_URL: http://leadia-dev-backend:8000
      WHATSAPP_CRM_TOKEN: ${WHATSAPP_CRM_TOKEN:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      AI_AUTH_URL: http://leadia-dev-backend:8000/auth/v1
    networks:
      dokploy-network:
        aliases: [leadia-whatsapp-dev]
    mem_limit: 128m
    cpus: 0.25

networks:
  dokploy-network:
    external: true
