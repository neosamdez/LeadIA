services:
  webhook:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEST_RECIPIENTS: ${WHATSAPP_TEST_RECIPIENTS:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v27.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_CRM_URL: http://leadia-dev-backend:8000
      WHATSAPP_CRM_TOKEN: ${WHATSAPP_CRM_TOKEN:-}
      WHATSAPP_EVOLUTION_ENABLED: ${WHATSAPP_EVOLUTION_ENABLED:-false}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      AI_AUTH_URL: http://leadia-dev-backend:8000/auth/v1
    networks:
      dokploy-network:
        aliases: [leadia-whatsapp-dev]
    mem_limit: 128m
    cpus: 0.25

networks:
  dokploy-network:
    external: true
