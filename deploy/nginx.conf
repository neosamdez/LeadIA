server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $leadia_backend ${LEADIA_API_HOST};
    set $leadia_ai ${LEADIA_AI_HOST};

    location ~ ^/auth/v1/admin(?:/|$) { return 404; }
    location = /ai/v1/complete {
        proxy_pass http://$leadia_ai;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }
    location ~ ^/(auth|rest)/v1/ {
        proxy_pass http://$leadia_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/healthz {
        proxy_pass http://$leadia_backend/healthz;
    }
    location = /config.js { add_header Cache-Control "no-store"; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
