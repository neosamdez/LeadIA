limit_req_zone $binary_remote_addr zone=signup:1m rate=3r/m;
server {
    listen 8000;
    server_name _;
    client_max_body_size 1m;
    location = /healthz {
        proxy_pass http://rest:3001/ready;
    }
    location ~ ^/auth/v1/admin(?:/|$) { return 404; }
    location = /auth/v1/signup {
        limit_req zone=signup burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://auth:9999/signup;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $http_host;
    }
    location / { return 404; }
}
