name: Database isolation
on:
  push:
    branches: [dev, main, 'feat/real-database']
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migration replay and tenant isolation
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/leadia_test
        run: sh tests/run-database.sh
